name: Android CI
on:
  push:
    branches: [main, master, "**", dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./code
      - name: Build and test with Gradle
        # tries a second time if the first build fails, since a network blip downloading
        # Gradle plugins (eg foojay-resolver-convention) can fail the build before it compiles.
        # a real error fails both times, so it still fails the check
        run: ./gradlew build --configuration-cache || (echo "Build failed, retrying once in 15s" && sleep 15 && ./gradlew build --configuration-cache)
        working-directory: ./code
  #source: Lab-08 Repo
